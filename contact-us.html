    <main class="page contact-us-page">
        <section class="clean-block clean-form dark">
            <div class="container" style="color: var(--gray-dark);">
                <div class="block-heading">
                    <div class="intro" style="color: var(--gray-dark);">
                        <h2 class="text-center"><br><strong>Contact Us</strong></h2>
                        <p style="color: var(--gray-dark);">For questions or feedback, please contact us by using the
                            form below. We'll get back to you soon as possible.</p>
                    </div>
                </div>
            </div>
            <div class="container" style="padding-bottom: 70px;">
                <form id="contactForm" action="MAILTO:sdgailab@undp.org" method="post" enctype="text/plain"><input
                        class="form-control" type="hidden" id="Name"><input class="form-control" type="hidden"
                        id="Email"><input class="form-control" type="hidden">
                    <div class="row mb-0">
                        <div class="col-md-6 col-xl-12" id="message">
                            <div class="has-feedback form-group mb-3"><label class="form-label"
                                    for="from_name">Name</label><input class="form-control" type="text" id="from_name"
                                    tabindex="-1" name="from_name" required="" placeholder="Full Name"></div>
                            <div class="has-feedback form-group mb-3"><label class="form-label"
                                    for="from_email">Email</label><input class="form-control" type="email"
                                    id="from_email" name="from_email" required="" placeholder="Email Address"></div>
                            <div class="form-group mb-3"><label class="form-label"
                                    for="comments">Comments</label><textarea class="form-control" id="comments"
                                    name="Comments" placeholder="Enter comments here" rows="8"></textarea></div>
                            <div class="form-group mb-3"><button class="btn btn-primary d-block w-100" type="submit"
                                    aria-label="Send contact form">Send <i
                                        class="fa fa-chevron-circle-right"></i></button></div>
                            <hr>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>
