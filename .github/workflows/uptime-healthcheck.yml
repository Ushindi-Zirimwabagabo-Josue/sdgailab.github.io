name: Uptime Health Check

on:
  schedule:
    # Run every 6 hours. This is frequent enough to catch outages and keep the
    # Supabase free-tier project warm without generating noisy traffic.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-healthcheck
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.HEALTHCHECK_SITE_URL || 'https://sdg-ai-lab.github.io/sdgailab.github.io/' }}

jobs:
  healthcheck:
    name: Check website and Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public website
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 10 \
            "$SITE_URL" > /dev/null

      - name: Check Supabase REST API
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ] || [ -z "$PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "PUBLIC_SUPABASE_URL and PUBLIC_SUPABASE_ANON_KEY secrets are required."
            exit 1
          fi

          curl --fail --silent --show-error --location \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 10 \
            --header "apikey: $PUBLIC_SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $PUBLIC_SUPABASE_ANON_KEY" \
            "$PUBLIC_SUPABASE_URL/rest/v1/statistics?select=id&limit=1" > /dev/null

  notify:
    name: Notify on failure
    needs: healthcheck
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Uptime health check failed';
            const labels = ['uptime', 'automated-healthcheck'];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled uptime health check failed.',
              '',
              `- Site URL: ${process.env.SITE_URL}`,
              `- Workflow run: ${runUrl}`,
              `- Checked at: ${new Date().toISOString()}`,
              '',
              'Please review the failed workflow logs and verify the website and Supabase project status.'
            ].join('\n');

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: label === 'uptime' ? 'd73a4a' : '0366d6',
                  description:
                    label === 'uptime'
                      ? 'Website or Supabase availability issue'
                      : 'Created automatically by the uptime health check workflow',
                });
              }
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
            });

            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels,
            });
